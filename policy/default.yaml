# assay default policy. Deny wins; default deny.
#
# Field names follow model.Policy. Unknown keys are rejected at load time.
# Evaluation order (internal/policy): signature -> agent known -> tool allowed
# for agent -> tool tier within agent boundary -> dangerous capability
# combination -> delegation depth -> delegation cycle -> budget -> rules
# (any deny wins, then any allow) -> default_effect.
#
# Tool names here must match the "name" field of the signed manifests in
# internal/tools/manifests/. Budgets are per agent per run.
version: "1"
default_effect: deny

dangerous_combinations:
  - [http.write, delegate]
  - [auth.login, report.external]
  - [fs.read, http.write]

agents:
  orchestrator:
    max_tier: medium
    allowed_tools: [delegate, report_finding, score_task]
    max_delegation_depth: 0
    budget:
      max_usd: 5
      max_latency_ms: 600000
  recon:
    max_tier: medium
    allowed_tools: [http_get, inspect_headers, report_finding]
    max_delegation_depth: 1
    budget:
      max_usd: 2
      max_latency_ms: 600000
  probe:
    max_tier: high
    allowed_tools: [http_get, http_post, inspect_headers, login_as, report_finding]
    max_delegation_depth: 2
    budget:
      max_usd: 4
      max_latency_ms: 600000
  validate:
    max_tier: high
    allowed_tools: [http_get, http_post, inspect_headers, login_as, report_finding]
    max_delegation_depth: 2
    budget:
      max_usd: 3
      max_latency_ms: 600000
  remediate:
    max_tier: medium
    allowed_tools: [http_get, report_finding]
    max_delegation_depth: 3
    budget:
      max_usd: 3
      max_latency_ms: 300000
  score:
    max_tier: low
    allowed_tools: [score_task]
    max_delegation_depth: 0
    budget:
      max_usd: 1
      max_latency_ms: 120000

rules:
  - id: no-external-reporting
    effect: deny
    match:
      capabilities: [report.external]
    rationale: Findings leave the harness only through the committed results pipeline

  - id: no-write-in-recon
    effect: deny
    match:
      agents: [recon, remediate]
      capabilities: [http.write, auth.login]
    rationale: Reconnaissance and remediation observe; they never change target state or authenticate

  - id: no-delegation-from-leaf-agents
    effect: deny
    match:
      agents: [score, remediate, recon, probe, validate]
      capabilities: [delegate]
    rationale: Only the orchestrator fans work out; worker agents are terminal

  - id: allow-read-only-tools
    effect: allow
    match:
      capabilities: [http.read, report]
      max_tier: medium
    rationale: Read-only tools at or below medium tier are the baseline for every agent

  - id: allow-scoring
    effect: allow
    match:
      agents: [score, orchestrator]
      tools: [score_task]
      max_tier: low
    rationale: Self-reflection scoring is a terminal, read-only step

  - id: allow-probe-auth
    effect: allow
    match:
      agents: [probe, validate]
      tools: [http_post, login_as]
      max_tier: high
    rationale: Probing and validation may authenticate and send write-shaped requests inside the authorized lab scope

  - id: allow-orchestrator-delegate
    effect: allow
    match:
      agents: [orchestrator]
      tools: [delegate]
    rationale: Only the orchestrator fans work out to worker agents
