# Pull-request configuration: the scripted fake provider only. Exercises the
# gate, signing, policy, audit, validation, reconciliation and overlap paths
# with no model API and no spend. Real runs use runs/ci.yaml.
name: fake-only
default_model: fake-model
providers:
  fake: { type: fake }
models:
  - { provider: fake, model: fake-model }
routes:
  recon: [{ provider: fake, model: fake-model }]
  probe: [{ provider: fake, model: fake-model }]
  validate: [{ provider: fake, model: fake-model }]
  remediate: [{ provider: fake, model: fake-model }]
  score: [{ provider: fake, model: fake-model }]
budgets:
  per_run: { max_usd: 15 }
  per_model: { max_usd: 6 }
  per_task: { max_usd: 1.5, max_latency_ms: 120000 }
cost_per_mtok:
  fake-model: { input_usd: 1, output_usd: 5, cache_read_usd: 0.10 }
max_failovers: 1
agent: { max_turns: 8, max_tokens: 2048 }
