# Default run configuration (dispatch config=ci). With ANTHROPIC_API_KEY set
# it assesses with Claude Sonnet 5.5 and Haiku 4.5 and the pinned local model;
# without the key the Anthropic models are dropped, the run is labelled
# degraded and only the local model runs. For the full frontier set (Opus 5.5
# and an OpenAI model too) use runs/frontier.yaml. Pull requests do not use
# this file; they run runs/pr.yaml with the scripted fake provider.
#
# The assessed set is the models list below (one independent agent per model
# per lab); `assay run` pins each model's probe and score routes to that model
# alone, so the routes here matter for other commands and for validation.
name: ci
default_model: claude-sonnet-5-5

providers:
  anthropic:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY
  local:
    # llama-server started by scripts/ci/start-llama.sh (labs/models.lock).
    type: openaicompat
    base_url: http://127.0.0.1:8081/v1
    timeout_ms: 600000

models:
  - { provider: anthropic, model: claude-sonnet-5-5 }
  - { provider: anthropic, model: claude-haiku-4-5 }
  - { provider: local, model: qwen2.5-3b-instruct-q4_k_m, max_latency_ms: 600000 }

routes:
  recon:
    - { provider: anthropic, model: claude-haiku-4-5 }
    - { provider: local, model: qwen2.5-3b-instruct-q4_k_m }
  probe:
    - { provider: anthropic, model: claude-sonnet-5-5 }
    - { provider: anthropic, model: claude-haiku-4-5 }
    - { provider: local, model: qwen2.5-3b-instruct-q4_k_m }
  validate:
    - { provider: anthropic, model: claude-sonnet-5-5 }
    - { provider: anthropic, model: claude-haiku-4-5 }
  remediate:
    - { provider: anthropic, model: claude-sonnet-5-5 }
    - { provider: anthropic, model: claude-haiku-4-5 }
  score:
    - { provider: anthropic, model: claude-haiku-4-5 }
    - { provider: local, model: qwen2.5-3b-instruct-q4_k_m }

budgets:
  per_run:   { max_usd: 15 }
  per_model: { max_usd: 6 }
  per_task:  { max_usd: 1.5, max_latency_ms: 120000 }

# USD per million tokens. Source: owner-published skill table, 2026-09-25.
cost_per_mtok:
  claude-sonnet-5-5: { input_usd: 2, output_usd: 10, cache_read_usd: 0.20 }
  claude-opus-5-5:   { input_usd: 4, output_usd: 20, cache_read_usd: 0.20 }
  claude-haiku-4-5:  { input_usd: 1, output_usd: 5,  cache_read_usd: 0.10 }
  # Local open-weight model: no per-token price; compute cost is CI minutes.
  qwen2.5-3b-instruct-q4_k_m: { input_usd: 0, output_usd: 0, cache_read_usd: 0 }

max_failovers: 1

agent:
  max_turns: 8
  max_tokens: 2048
