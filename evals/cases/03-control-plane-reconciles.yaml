name: control-plane-reconciles
model_glob: "*"
# Evidence: run 20261008-010140-7420e126 (all three labs, two models) had
# zero reconciliation mismatches after tool call ids were scoped per task
# (ADR 0014). Earlier runs showed false mismatches from that join bug.
max_reconcile_mismatches: 0
require_zero_refusals: true
note: >
  Every finding's claimed tool calls are joined against the control plane,
  per task. Any mismatch is a regression: either a model reused an id inside
  one task, or an executed call is missing from the transcript.
