name: local-model-latency
model_glob: "qwen*"
# Evidence: p95 wall time of one lab assessment for the local model on a
# shared CI runner. Without reflection: 81.5 s, 155.7 s, 216.6 s in three
# committed runs. With self-reflection and revisions (ADR 0017): 1319 s in run
# 20261008-134835-97b5fbe2. The band is the default of 50 minutes.
max_p95_ms: 3000000
max_cost_usd: 0
note: >
  CPU inference of a 3B model on a shared runner varies widely, and a lab
  assessment now includes scoring and up to two revisions. This band catches
  a hang or a runaway, not a small slowdown.
