name: local-model-latency
model_glob: "qwen*"
# Evidence: p95 per lab for the local model on a shared CI runner was
# 81.5 s, 155.7 s and 216.6 s in three committed runs. The band is the
# default five minutes, about 1.4 times the worst observed.
max_p95_ms: 300000
max_cost_usd: 0
note: >
  CPU inference of a 3B model on a shared runner varies widely. This band
  catches a regression to something unusable, not a small slowdown.
